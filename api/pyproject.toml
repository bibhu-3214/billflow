[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"manage.py" = ["E402"]
"scripts/serve_acceptance.py" = ["E402"]
"scripts/verify_web_build.py" = ["E402"]
