services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billflow
      POSTGRES_USER: billflow
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - billflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billflow -d billflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  billflow-postgres:
